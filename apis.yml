apis:
- name: PassiveLogic REST API
  description: >-
    HTTP REST API documenting authentication (JWT login, magic link, Keycloak-backed flows), API key generation,
    account and organization management, auth groups, image and binding upload, PassiveLogic device login and
    registration, Tailscale tunnel auth, CSV property-history export, health checks and GraphQL access. Versioned in
    the URI path (unversioned alias plus /api/v0.19 and /api/v0.20 trains). Published as OpenAPI 3.0.1 at
    https://passivelogic.com/api/doc and rendered in a PassiveLogic-branded Swagger UI.
  humanURL: https://passivelogic.com/app/swagger/
