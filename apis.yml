aid: passivelogic
name: PassiveLogic
description: >-
  PassiveLogic builds a physics-based autonomy platform for buildings and industrial systems — the Hive, Hive Mini and
  Cell edge controllers, the Sense wireless sensor line, and the Autonomy Suite design/operate applications (Blueprint,
  Creator, Lens, Live, Portfolio, Qortex). Its software core is Quantum, an open physics-based digital twin ontology
  and data model for autonomous systems, developed with the U.S. Department of Energy and the Quantum Alliance
  consortium. The Quantum API is exposed as a GraphQL query and subscription surface over the digital twin graph, sat
  behind a documented HTTP REST API covering authentication, API-key issuance, organizations, auth groups, images,
  bindings, device registration, CSV property-history export and QuantumSync WebSocket data sync. Authentication is
  handled by an external Keycloak identity provider (OpenID Connect) with JWT, XSRF-protected session tokens and
  long-lived PL API keys.
