- name: Quantum GraphQL API
  description: >-
    The Quantum API — a GraphQL query surface over the Quantum digital twin graph, letting clients query buildings,
    floors, zones, surfaces, equipment, components, properties and time-series data from the physics-based ontology.
    Supports GET and POST, plus GraphQL subscriptions over WebSocket at /api/graphqlSubscribe and QuantumSync
    real-time data sync at /api/quantumsync. Authenticated with a JWT bearer or a PL-API-KEY header; schema
    introspection is available to authenticated clients and through the Quantum Insights query builder.
  humanURL: https://quantumalliance.org/documentation/
  baseURL: https://passivelogic.com/api/graphql
