      responses:
        '200':
          content:
            application/json:
              examples:
                GenericMessageResponse:
                  $ref: '#/components/examples/GenericMessageResponse'
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
          description: OK
      operationId: postApiV0.20AuthRegisterInitiate
  /api/v0.20/auth/offline:
    get:
      description: GET /auth/offline
      security:
      - Basic Auth - login: []
      - XSRF header: []
      - DEPRECATED - PL API Key: []
      - PL API Key: []
      tags:
      - Authentication
components:
  schemas:
    RegisterUserData:
      properties:
        token:
          type:
          - string
          - 'null'
        recaptchaToken:
          type:
          - string
          - 'null'
        email:
          description: User's email
          type: string
        acceptMailingList:
          type: boolean
          description: Flag to mark if the user wants marketing emails
        password:
          description: User's password
          type: string
        username:
          type:
          - string
          - 'null'
        acceptedEULA:
          description: Flag to mark if the user has accepted the EULA
          type: boolean
        lastName:
          description: User's last name
          type: string
        firstName:
          description: User's first name
          type: string
      required:
      - acceptMailingList
      - acceptedEULA
      - email
      - firstName
      - lastName
      - password
      description: Data required for user registration
      type: object
    QuantumUserStatus:
      enum:
      - Active
      - Blocked
      - Deleted
      - Locked
      - Pending
      - Reset
      type: string
    KeycloakUserInfo:
      type: object
      properties:
        requiredActions:
          description: Actions the user will need to do on next login
          items:
            type: string
          type:
          - array
          - 'null'
        lastName:
          description: The user's last name (surname)
          type:
          - string
          - 'null'
        email:
          description: Email for the user, also used as the username
          type: string
        emailVerified:
          description: Has the email address for this user been verified as valid
          type:
          - boolean
          - 'null'
        firstName:
          description: The user's first (given) name
          type:
          - string
          - 'null'
        roles:
          description: Roles for this user
          items:
            type: string
          type:
          - array
          - 'null'
        groups:
          description: Groups that this user belongs to
          items:
            type: string
          type:
          - array
          - 'null'
        access:
          additionalProperties:
            type: boolean
          description: Access rights for this user
          type:
          - object
          - 'null'
        id:
          description: Unique ID for the user
          type:
          - string
          - 'null'
        attributes:
          additionalProperties:
            items:
              type: string
            type: array
          description: Additional attributes of the user; each attribute can have multiple values
          type:
          - object
          - 'null'
        username:
          description: Unique username for the user
          type:
          - string
          - 'null'
        enabled:
          description: Active or inactive status for the user
          type:
          - boolean
          - 'null'
      description: Information for Keycloak about the requested user.
      required:
      - email
    JWKS:
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JWK'
      required:
      - keys
      type: object
    MagicLinkResponse:
      type: object
      properties:
        url:
          description: Url to be used a magic link login.
          type:
          - string
          - 'null'
        message:
          description: Message describing the response type.
          type:
          - string
          - 'null'
      description: Email for use signing up with a magic link
    GenerateApiKeyResponse:
      properties:
        expiration:
          description: Expiration of the new key.
          format: int64
          type: integer
        key:
          description: New API key.
          type: string
      required:
      - expiration
      - key
      description: New API key generated for a user.
      type: object
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Signed Authentication JWT
        refresh:
          type: string
          description: Signed refresh JWT
        whoAmI:
          $ref: '#/components/schemas/WhoAmIResponse'
      description: Generic response information
      required:
      - refresh
      - token
      - whoAmI
    JWK:
      type: object
      properties:
        kty:
          type: string
      required:
      - kty
    ChangeUserPassword:
      properties:
        oldPassword:
          description: Old password for the user, used to confirm identity.
          type: string
        newPassword:
          description: New password for the user.
          type: string
      required:
      - newPassword
      - oldPassword
      description: Information required to change a user's password from the authenticated change password
        flow
      type: object
    RegisterUserResponse:
      properties:
        newUserID:
          $ref: '#/components/schemas/Identifier'
        message:
          type: string
          description: Additional information about the response
        refresh:
          type:
          - string
          - 'null'
          description: New refresh JWT
        token:
          type:
          - string
          - 'null'
          description: New authentication JWT containing changed information
        userStatus:
          $ref: '#/components/schemas/QuantumUserStatus'
      required:
      - message
      description: Sent when a new user is successfully registered.
      type: object
    GenericMessageResponse:
      type: object
      properties:
        message:
          description: Informative message relating to the specific response
          type: string
      description: Generic response information
      required:
      - message
    RequestResetPasswordData:
      properties:
        usernameOrEmail:
          description: Email of the user requesting a reset.
          type: string
      required:
      - usernameOrEmail
      description: Information required to request a password reset.
      type: object
    UserRegistrationInitiation:
      type: object
      properties:
        email:
          description: Email that is registering for a new account.
          type: string
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
      description: Information for intiating user registration
      required:
      - email
    UpdatedUserEmail:
      properties:
        password:
          description: user's password to confirm identity
          type: string
        oldEmail:
          description: Previous user email
          type: string
        newEmail:
          description: New user email
          type: string
      required:
      - newEmail
      - oldEmail
      - password
      description: Information for changing a user's email
      type: object
    ChangePasswordData:
      properties:
        newPassword:
          description: New password for the user.
          type: string
        confirmNewPassword:
          type:
          - string
          - 'null'
      required:
      - newPassword
      description: Information required to change a user's password from the reset password flow
      type: object
    WhoAmIResponse:
      type: object
      properties:
        emailVerified:
          type:
          - boolean
          - 'null'
          description: Flag to mark if the user's email is verified
        eulaAccepted:
          type:
          - boolean
          - 'null'
          description: Flag to mark if the user has acept the terms of the EULA
        lastName:
          type:
          - string
          - 'null'
          description: User's last name
        firstName:
          type:
          - string
          - 'null'
          description: User's first name
        userID:
          type: string
          description: Unique ID for the user
          format: uuid
      description: Information about the authenticated user
      required:
      - userID
