                $ref: '#/components/examples/UserRegistrationInitiation'
      security:
      - Basic Auth - login: []
      - XSRF header: []
      - DEPRECATED - PL API Key: []
      - PL API Key: []
      summary: Generates a Magic Link to be used to login.
      description: 'DEPRECATED: This endpoint is not available when Keycloak authentication is turned
        on and will be removed in the future.


        Generates magic link containing `?token=<signed JWT with user email contained>` and sends it in
        an email to the user.

        This is the secure mode and MUST be used in production.

        This will not return a link to the client.


        If User does not exist in Database, will throw 400 bad request. If user exists, will return 200
        ok.

        These links can then be used to login from GET magic-link-login.'
      tags:
      - Authentication
      operationId: postApiV0.19AuthMagic-link-generate
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicLinkResponse'
          description: OK
  /api/auth/zendesk:
    get:
      description: 'Redirects a user to the PassiveLogic Zendesk portal.

        If they are already authenticated with their PL account when making this request,

        they will be automatically logged in to Zendesk as well. Otherwise they will be redirected to
        the Zendesk login page.

        A `returnTo` query parameter can be used to support deep linking to, for example, specific support
        articles.'
      summary: Logs a user in to Zendesk using their PL Account
      tags:
      - Authentication
      operationId: getApiAuthZendesk
  /api/v0.19/auth/profile/change:
    get:
      operationId: getApiV0.19AuthProfileChange
      tags:
      - Authentication
      description: ''
      security:
      - Basic Auth - login: []
      - XSRF header: []
      - DEPRECATED - PL API Key: []
      - PL API Key: []
      summary: Redirects the user the change profile flow in the external auth provider (Keycloak).
  /api/v0.19/auth/api-key/generate:
    get:
      responses:
        '200':
          content:
            application/json:
              examples:
                GenerateApiKeyResponse:
                  $ref: '#/components/examples/GenerateApiKeyResponse'
              schema:
                $ref: '#/components/schemas/GenerateApiKeyResponse'
          description: OK
      security:
      - Basic Auth - login: []
      - XSRF header: []
      - DEPRECATED - PL API Key: []
      - PL API Key: []
      summary: Generates an API key for the current user
      tags:
      - Authentication
      description: 'Generates, stores, and returns a new API key with the default expiration period for
        the user currently logged in.


        Once created, you can then provide this API key in an

        `Authorization: PL-API-KEY <Key>` header in replacement of an `X-PL-AUTH` header.'
      operationId: getApiV0.19AuthApi-keyGenerate
      parameters:
      - description: Number of seconds until the key expires.
        example: 2678400
        schema:
          type:
          - integer
          - 'null'
          format: int64
        required: false
        name: expireSeconds
        in: query
      - description: Role of the new key.
        example: ReadOnlyUser
        schema:
          type:
          - string
          - 'null'
        required: false
        name: role
        in: query
  /api/auth/logout:
    post:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
              examples:
                GenericMessageResponse:
                  $ref: '#/components/examples/GenericMessageResponse'
          description: OK
      security:
      - Basic Auth - login: []
      - XSRF header: []
      - DEPRECATED - PL API Key: []
      - PL API Key: []
      description: 'If external auth (Keycloak) is enabled, this initiates the external logout process.


        Otherwise, if a cookie keyed by pl-refresh-token is provided in the logout request, that refresh
        token is revoked.


        The response sets the auth & refresh cookies to empty values & marks them as expired.

        New tokens must then be generated by the login endpoint.'
      tags:
      - Authentication
      summary: Logs out a user
      operationId: postApiAuthLogout
  /api/v0.19/auth/kc/{user}:
    post:
      parameters:
      - name: user
        required: true
        schema:
          type: string
        in: path
      security:
      - Basic Auth - login: []
      - XSRF header: []
      - DEPRECATED - PL API Key: []
      - PL API Key: []
      summary: Validates a user's password
      tags:
      - Authentication
      description: 'Allows the Keycloak migration plugin to validate a user''s password. Once validated,
        the password is saved

        to Keycloak''s database and is subsequently no longer validated using this API.'
      responses:
        '200':
          content:
            application/json:
              examples:
                GenericMessageResponse:
                  $ref: '#/components/examples/GenericMessageResponse'
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
          description: OK
      operationId: postApiV0.19AuthKcByUser
    get:
      parameters:
      - name: user
        required: true
        schema:
          type: string
        in: path
      security:
      - Basic Auth - login: []
      - XSRF header: []
      - DEPRECATED - PL API Key: []
      - PL API Key: []
      summary: Retrieves user information for Keycloak
      tags:
      - Authentication
      description: 'Enables migrating users to Keycloak by providing an API endpoint for retrieving user
        information. This

        information is then saved to Keycloak''s own database.'
      responses:
        '200':
          content:
            application/json:
              examples:
                KeycloakUserInfo:
                  $ref: '#/components/examples/KeycloakUserInfo'
              schema:
                $ref: '#/components/schemas/KeycloakUserInfo'
          description: OK
      operationId: getApiV0.19AuthKcByUser
  /api/v0.19/auth/whoami:
    get:
      tags:
      - Authentication
      operationId: getApiV0.19AuthWhoami
      description: Useful to check if a user is authenticated.
      summary: Returns information about the currently logged in user.
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                WhoAmIResponse:
                  $ref: '#/components/examples/WhoAmIResponse'
              schema:
                $ref: '#/components/schemas/WhoAmIResponse'
      security:
      - Basic Auth - login: []
      - XSRF header: []
      - DEPRECATED - PL API Key: []
      - PL API Key: []
  /api/v0.19/auth/register/initiate:
    post:
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationInitiation'
            examples:
              UserRegistrationInitiation:
                $ref: '#/components/examples/UserRegistrationInitiation'
        required: true
      summary: Sends an email to begin email verification and registration.
      tags:
      - Authentication
      description: 'DEPRECATED: This endpoint is not available when Keycloak authentication is turned
        on and will be removed in the future.


        Initiates the PassiveLogic registration process by sending an email to the given user. A user
        is not stored in the system

        at this point in the process - instead this serves as the initial step proving that a uer has
        access to the email they

        are signing up with.


        Email will contain a link that holds a signed JWT from us. That JWT is later used to validate
        and complete registration.


        No authentication required.'
      operationId: postApiV0.19AuthRegisterInitiate
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
              examples:
                GenericMessageResponse:
                  $ref: '#/components/examples/GenericMessageResponse'
          description: OK
  /api/v0.19/auth/email/change:
    post:
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatedUserEmail'
            examples:
              UpdatedUserEmail:
                $ref: '#/components/examples/UpdatedUserEmail'
      security:
      - Basic Auth - login: []
      - XSRF header: []
      - DEPRECATED - PL API Key: []
      - PL API Key: []
      summary: Initiates an email change for the current user.
      tags:
      - Authentication
      description: 'DEPRECATED: This endpoint is not available when Keycloak authentication is turned
        on and will be removed in the future.


        Sends an update email request to the provided new email address.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
              examples:
                GenericMessageResponse:
                  $ref: '#/components/examples/GenericMessageResponse'
      operationId: postApiV0.19AuthEmailChange
  /api/v0.20/auth/register/initiate:
    post:
      deprecated: true
