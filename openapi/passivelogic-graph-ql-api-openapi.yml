components:
  schemas:
    GraphQLRequest:
      properties:
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            type: boolean
        operationName:
          type:
          - string
          - 'null'
        query:
          type: string
      required:
      - query
      type: object
    GraphQLError:
      properties:
        message:
          type: string
        extensions:
          type:
          - object
          - 'null'
          additionalProperties:
            type: boolean
        locations:
          items:
            $ref: '#/components/schemas/SourceLocation'
          type: array
        path:
          items:
            items:
              format: int64
              type: integer
            type: array
          type: array
      required:
      - locations
      - message
      - path
      type: object
    GraphQLResult:
      properties:
        data:
          type:
          - boolean
          - 'null'
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GraphQLError'
      type: object
    SourceLocation:
      properties:
        column:
          type: integer
          format: int64
        line:
          type: integer
          format: int64
      required:
      - column
      - line
      type: object
  securitySchemes:
    XSRF_header:
      in: header
      description: Authentication using an XSRF protected JWT
      name: X-PL-AUTH
      type: apiKey
    Basic_Auth_-_login:
      description: Basic authentication used only at login.
      scheme: basic
      type: http
    PL_API_Key:
      in: header
      description: PL API Key in header
      name: PL-API-KEY
      type: apiKey
    DEPRECATED_-_PL_API_Key:
      in: header
      description: DEPRECATED - PL API Key in Bearer header
      name: 'Authorization: PL-API-KEY'
      type: apiKey
