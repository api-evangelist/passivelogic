  /api/quantumsync:
    get:
      description: "# Custom QuantumSync/ShadowClient API:\n\n## QuantumSync QuantumSyncRequestTypes:\n### `start`: authenticates\
        \ and specifies an initial context. note: the id for start and updateContext is used to key a Dictionary[String:AnyRootedQuantumGraph]\n\
        ex)\n```json\n{\n    \"type\": \"start\",\n    \"id\": \"site\",\n    \"appType\":\"BuildingStudio\"\n    \"payload\"\
        : {\n        \"authToken\": \"REDACTED\",\n        \"ID\": \"ACAF9E07-5031-4BC2-A8C5-D2C6598D83DE\",\n        \"from\"\
        : \"Site\",\n        \"include\": [\n            \"Site\",\n            \"Building\",\n            \"Floor\",\n  \
        \          \"Zone\"\n    ]\n    }\n}\n```\n\n### `updateContext`: change the current context / graph in memory.\n\
        note: the previous graph/context can be returned from memory by using updateContext id: <previous id used in start\
        \ or updateContext>.\nUp to 5 contexts can be loaded before prevention (error) or deleteContext message needed to\
        \ free up loaded count to load a new context.\n\nex)\n```json\n{\n    \"type\": \"updateContext\",\n    \"id\": \"\
        building\",\n    \"payload\": {\n        \"ID\": \"ACAF9E07-5031-4BC2-A8C5-D2C6598D83DE\",\n        \"from\": \"Building\"\
        ,\n        \"include\": [\n            \"Site\",\n            \"Floor\",\n            \"Zone\",\n            \"Image\"\
        ,\n            \"Surface\",\n            \"Adjacency\",\n            \"System\",\n            \"Quanta\",\n      \
        \      \"Manufacturer\",\n            \"Equipment\",\n            \"Property\",\n            \"Location\"\n      \
        \  ]\n    }\n}\n```\n\n### `deleteContext`: delete/clear the context out of memory.\nex)\n```json\n{\n    \"type\"\
        : \"deleteContext\",\n    \"id\": \"building\",\n    \"payload\": {}\n}\n```\n\n### `sync`: create/update/delete QuantumObjects\
        \ via a FlatGraphDiff as the payload.\n\nExecuting concurrent sync's is not allowed. If there is a sync already processing\
        \ and another sync is requested before the response of the first sync is sent, then the 2nd symc will return an error\
        \ saying there is a sync currently processing, and to wait until its finished before requesting another sync.\n\n\
        ex)\n```json\n{\n    \"type\": \"sync\",\n    \"id\": \"F5B6BC51-B991-440C-8ACB-B55C65FD7C24\",\n    \"payload\":\
        \ {\n        \"added\": [],\n        \"updated\": [\n            {\n                \"description\": null,\n     \
        \           \"ID\": \"80187B0B-CEEB-488A-A9B7-06784CFB0464\",\n                \"longitude\": null,\n            \
        \    \"locationPropertyID\": null,\n                \"elevation\": null,\n                \"latitude\": null,\n  \
        \              \"address\": null,\n                \"timeZone\": null,\n                \"siteIDs\": [\n         \
        \           \"7E7E04B4-8F32-4585-839D-E0EFC7BB3544\"\n                ],\n                \"weatherSourceIDs\": [],\n\
        \                \"locked\": false,\n                \"authGroupID\": \"A1EBEC59-D887-473F-A5C5-7CBD4ADB2556\",\n\
        \                \"__typename\": \"Location\",\n                \"name\": \"foo\"\n            }\n        ],\n   \
        \     \"removed\": []\n    }\n}\n```\n\n### `syncEphemeral`: create/update/delete QuantumObjects via a FlatGraphDiff\
        \ as the payload, do not write them to the database,\nand discard them at the end of the websocket session.\nex)\n\
        ```json\n{\n    \"type\": \"syncEphemeral\",\n    \"id\": \"F5B6BC51-B991-440C-8ACB-B55C65FD7C24\",\n    \"payload\"\
        : {\n        \"added\": [],\n        \"updated\": [\n            {\n                \"description\": null,\n     \
        \           \"ID\": \"80187B0B-CEEB-488A-A9B7-06784CFB0464\",\n                \"longitude\": null,\n            \
        \    \"locationPropertyID\": null,\n                \"elevation\": null,\n                \"latitude\": null,\n  \
        \              \"address\": null,\n                \"timeZone\": null,\n                \"siteIDs\": [\n         \
        \           \"7E7E04B4-8F32-4585-839D-E0EFC7BB3544\"\n                ],\n                \"weatherSourceIDs\": [],\n\
