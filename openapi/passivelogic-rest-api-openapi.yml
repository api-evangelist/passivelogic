        line:
          type: integer
          format: int64
      required:
      - column
      - line
      type: object
    WhoAmIResponse:
      type: object
      properties:
        emailVerified:
          type: boolean
          nullable: true
          description: Flag to mark if the user's email is verified
        eulaAccepted:
          type: boolean
          nullable: true
          description: Flag to mark if the user has acept the terms of the EULA
        lastName:
          type: string
          nullable: true
          description: User's last name
        firstName:
          type: string
          nullable: true
          description: User's first name
        userID:
          type: string
          description: Unique ID for the user
          format: uuid
      description: Information about the authenticated user
      required:
      - userID
    DeployedOnHiveResponse:
      properties:
        runningOnHive:
          type: boolean
      required:
      - runningOnHive
      type: object
    AcceptOrganizationInvite:
      properties:
        inviteID:
          description: ID of the invitation being accepted.
          type: string
          format: uuid
      required:
      - inviteID
      description: Parameters required to accept an organization invite
      type: object
    GraphQLRequest:
      properties:
        variables:
          nullable: true
          type: object
          additionalProperties:
            type: boolean
        operationName:
          nullable: true
          type: string
        query:
          type: string
      required:
      - query
      type: object
    DeviceLoginResponse:
      properties:
        token:
          type: string
          description: Signed authentication JWT
      required:
      - token
      description: Response to /api/device/login
      type: object
    ChangePasswordData:
      properties:
        newPassword:
          description: New password for the user.
          type: string
        confirmNewPassword:
          nullable: true
          type: string
      required:
      - newPassword
      description: Information required to change a user's password from the reset password flow
      type: object
    UploadFileData:
      properties:
        ID:
          type: string
          description: UUID of the quantum binding node that you want to associate this file with.
          format: uuid
        filePath:
          nullable: true
          type: string
        file:
          type: string
          description: File data to write to the server.
          format: byte
        fileType:
          type: string
          description: The type of file the given data represents.
      required:
      - ID
      - file
      - fileType
      description: Data required to upload a file binding.
      type: object
    TailscalePostTailnetKeyResponse:
      properties:
        revoked:
          nullable: true
          format: date-time
          type: string
        key:
          type: string
        expires:
          nullable: true
          format: date-time
          type: string
        id:
          type: string
        description:
          nullable: true
          type: string
        expirySeconds:
          format: int64
          type: integer
        created:
          nullable: true
          format: date-time
          type: string
        invalid:
          nullable: true
          type: boolean
        scopes:
          nullable: true
          type: array
          items:
            type: string
        capabilities:
          $ref: '#/components/schemas/TailscaleCapabilities'
        tags:
          nullable: true
          type: array
          items:
            type: string
        keyType:
          type: string
        userId:
          nullable: true
          type: string
      required:
      - capabilities
      - expirySeconds
      - id
      - key
      - keyType
      type: object
    KeycloakUserInfo:
      type: object
      properties:
        requiredActions:
          description: Actions the user will need to do on next login
          nullable: true
          items:
            type: string
          type: array
        lastName:
          description: The user's last name (surname)
          nullable: true
          type: string
        email:
          description: Email for the user, also used as the username
          type: string
        emailVerified:
          description: Has the email address for this user been verified as valid
          nullable: true
          type: boolean
        firstName:
          description: The user's first (given) name
          nullable: true
          type: string
        roles:
          description: Roles for this user
          nullable: true
          items:
            type: string
          type: array
        groups:
          description: Groups that this user belongs to
          nullable: true
          items:
            type: string
          type: array
        access:
          additionalProperties:
            type: boolean
          description: Access rights for this user
          nullable: true
          type: object
        id:
          description: Unique ID for the user
          nullable: true
          type: string
        attributes:
          additionalProperties:
            items:
              type: string
            type: array
          description: Additional attributes of the user; each attribute can have multiple values
          nullable: true
          type: object
        username:
          description: Unique username for the user
          nullable: true
          type: string
        enabled:
          description: Active or inactive status for the user
          nullable: true
          type: boolean
      description: Information for Keycloak about the requested user.
      required:
      - email
