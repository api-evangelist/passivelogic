openapi: 3.0.1
info:
  version: 0.0.0
  description: 'This page documents the operations supported by the PassiveLogic HTTP API, covering authentication, user management,
    and

    GraphQL API access.'
  title: PassiveLogic REST API
paths:
  /app/lp/**:
    get:
      tags:
      - app
      description: GET /app/lp/**
  /api/v0.20/auth/email/change/verify:
    get:
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatedUserEmail'
            examples:
              UpdatedUserEmail:
                $ref: '#/components/examples/UpdatedUserEmail'
        required: true
      security:
      - Basic Auth - login: []
      - XSRF header: []
      - DEPRECATED - PL API Key: []
      - PL API Key: []
      summary: Verifies and updates new user email
      tags:
      - Authentication
      description: 'DEPRECATED: This endpoint is not available when Keycloak authentication is turned on and will be removed
        in the future.


        Verifies the new email is valid. Updates the user email with the newly validated one.


        Token authentication required. Provided by /api/v0.20/auth/email/change.'
      responses:
        '200':
          content:
            application/json:
              examples:
                GenericMessageResponse:
                  $ref: '#/components/examples/GenericMessageResponse'
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
          description: OK
      operationId: getApiV0.20AuthEmailChangeVerify
  /app/qs/**:
    get:
      tags:
      - app
      description: GET /app/qs/**
  /api/v0.19/util/externalauthconfig:
    get:
      operationId: getApiV0.19UtilExternalauthconfig
      description: Use to check whether or not external auth (i.e. Keycloak) is enabled, and if so what the public settings
        are.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
              examples:
                String:
                  $ref: '#/components/examples/String'
      tags:
      - Utility
      summary: Provides information about the external auth configuration
  /api/v0.19/util/quantumlens:
    post:
      security:
      - Basic Auth - login: []
      - XSRF header: []
      - DEPRECATED - PL API Key: []
      - PL API Key: []
      operationId: postApiV0.19UtilQuantumlens
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuantumLensResponse'
      description: 'Returns the status of the QuantumLens application for the current user.


        - `appUpdate`: indicates if a new app version is required (true = forced, false = soft, nil = no update)

        - `osUpdate`: indicates if an iOS update is required (true = update required, nil = compatible)

        - `user`: information about the current user


        This response helps the client determine whether the app or iOS requires an update before continuing.'
      tags:
      - Utility
      summary: QuantumLens (iOS) update & compatibility check
  /api/v0.20/util/externalauthconfig:
    get:
      summary: Provides information about the external auth configuration
      tags:
      - Utility
      description: Use to check whether or not external auth (i.e. Keycloak) is enabled, and if so what the public settings
        are.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
              examples:
                String:
                  $ref: '#/components/examples/String'
      operationId: getApiV0.20UtilExternalauthconfig
  /api/auth/magic-link-generate:
    post:
      deprecated: true
      requestBody:
        content:
          application/json:
            examples:
              UserRegistrationInitiation:
                $ref: '#/components/examples/UserRegistrationInitiation'
            schema:
              $ref: '#/components/schemas/UserRegistrationInitiation'
        required: true
      security:
      - Basic Auth - login: []
      - XSRF header: []
      - DEPRECATED - PL API Key: []
      - PL API Key: []
      summary: Generates a Magic Link to be used to login.
      tags:
      - Authentication
      description: 'DEPRECATED: This endpoint is not available when Keycloak authentication is turned on and will be removed
        in the future.


        Generates magic link containing `?token=<signed JWT with user email contained>` and sends it in an email to the user.

        This is the secure mode and MUST be used in production.

        This will not return a link to the client.


        If User does not exist in Database, will throw 400 bad request. If user exists, will return 200 ok.

        These links can then be used to login from GET magic-link-login.'
      operationId: postApiAuthMagic-link-generate
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicLinkResponse'
          description: OK
  /api/v0.20/authgroup/decline:
    post:
      security:
      - Basic Auth - login: []
      - XSRF header: []
      - DEPRECATED - PL API Key: []
      - PL API Key: []
      requestBody:
        content:
          application/json:
            examples:
              DeclineOrganizationInvite:
                $ref: '#/components/examples/DeclineOrganizationInvite'
            schema:
              $ref: '#/components/schemas/DeclineOrganizationInvite'
        required: true
      summary: Declines an AuthGroup invitation
      tags:
      - Auth Groups
      description: 'Rejects an invitation based on AuthGroup invite ID.

        Invitation is deleted.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
              examples:
                GenericMessageResponse:
                  $ref: '#/components/examples/GenericMessageResponse'
      operationId: postApiV0.20AuthgroupDecline
  /api/v0.19/auth/email/change/verify:
    get:
      deprecated: true
