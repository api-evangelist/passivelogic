          description: Signed Authentication JWT
        refresh:
          type: string
          description: Signed refresh JWT
        whoAmI:
          $ref: '#/components/schemas/WhoAmIResponse'
      description: Generic response information
      required:
      - refresh
      - token
      - whoAmI
