      operationId: getAppLoginUserAuth
  /api/auth/password/change:
    post:
      deprecated: true
      requestBody:
        content:
          application/json:
            examples:
              ChangeUserPassword:
                $ref: '#/components/examples/ChangeUserPassword'
            schema:
              $ref: '#/components/schemas/ChangeUserPassword'
        required: true
      security:
      - Basic Auth - login: []
      - XSRF header: []
      - DEPRECATED - PL API Key: []
      - PL API Key: []
      summary: Changes a user's password for an already authenticated user.
      tags:
      - Authentication
      description: 'DEPRECATED: This endpoint is not available when Keycloak authentication is turned on and will be removed
        in the future.


        Changes an authenticated user''s password to the specified value.'
      operationId: postApiAuthPasswordChange
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
              examples:
                GenericMessageResponse:
                  $ref: '#/components/examples/GenericMessageResponse'
          description: OK
    get:
      tags:
      - Authentication
      operationId: getApiAuthPasswordChange
      description: ''
      summary: Redirects the user to the change password flow in the external auth provider (Keycloak).
      security:
      - Basic Auth - login: []
      - XSRF header: []
      - DEPRECATED - PL API Key: []
      - PL API Key: []
  /api/v0.19/util/ping:
    get:
      summary: Keep-alive ping/pong route
      operationId: getApiV0.19UtilPing
      responses:
        '200':
          content:
            text/plain:
              examples:
                String:
                  $ref: '#/components/examples/String'
              schema:
                type: string
          description: OK
      tags:
      - Utility
      description: Use to check webserver health or keep connection alive. Returns pong message.
  /api/authgroup/remove/{authGroupID}/{userID}:
    post:
      parameters:
      - schema:
          type: string
        name: authGroupID
        in: path
        required: true
      - schema:
          type: string
        name: userID
        in: path
        required: true
      security:
      - Basic Auth - login: []
      - XSRF header: []
      - DEPRECATED - PL API Key: []
      - PL API Key: []
      summary: Removes user from Auth Group
      description: 'Remove a User from an AuthGroup. Users must have PrivilegedUser or greater permissions to remove another
        user.

        User can only remove other users with permissions less than or equal to their own permissions. For example: PrivilegedUsers

        cannot remove SuperUsers.'
      tags:
      - Auth Groups
      operationId: postApiAuthgroupRemoveByAuthGroupIDByUserID
      responses:
        '200':
          content:
            application/json:
              examples:
                AuthGroupRemovalResponse:
                  $ref: '#/components/examples/AuthGroupRemovalResponse'
              schema:
                $ref: '#/components/schemas/AuthGroupRemovalResponse'
          description: OK
  /api/v0.19/auth/password/reset:
    post:
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            examples:
              RequestResetPasswordData:
                $ref: '#/components/examples/RequestResetPasswordData'
            schema:
              $ref: '#/components/schemas/RequestResetPasswordData'
      summary: Initiates a password reset.
      tags:
      - Authentication
      description: 'DEPRECATED: This endpoint is not available when Keycloak authentication is turned on and will be removed
        in the future.


        Initiates a password reset for the given user, sending them an email with a password reset link authenticated to their

        account only.'
      operationId: postApiV0.19AuthPasswordReset
      responses:
        '200':
          content:
            application/json:
              examples:
                GenericMessageResponse:
                  $ref: '#/components/examples/GenericMessageResponse'
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
          description: OK
  /app/login/password:
    get:
      summary: Redirects to external authentication provider (Keycloak).
      operationId: getAppLoginPassword
      description: ''
      tags:
