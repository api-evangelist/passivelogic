openapi: 3.2.0
info:
  version: 0.0.0
  description: 'This page documents the operations supported by the PassiveLogic HTTP API, covering authentication, user management, and

    GraphQL API access.'
  title: PassiveLogic REST App API
tags:
- name: App
paths:
  /app/lp/**:
    get:
      tags:
      - App
      description: GET /app/lp/**
      summary: Get app lp **
      x-summary-source: derived
      operationId: getAppLp**
      x-operation-id-source: derived
  /app/qs/**:
    get:
      tags:
      - App
      description: GET /app/qs/**
      summary: Get app qs **
      x-summary-source: derived
      operationId: getAppQs**
      x-operation-id-source: derived
  /app/qe/*:
    get:
      tags:
      - App
      description: GET /app/qe/*
      summary: Get app qe *
      x-summary-source: derived
      operationId: getAppQe*
      x-operation-id-source: derived
  /app/login/userAuth:
    get:
      summary: Redirects to external authentication provider (Keycloak)
      description: ''
      tags:
      - App
      operationId: getAppLoginUserAuth
  /app/login/password:
    get:
      summary: Redirects to external authentication provider (Keycloak)
      operationId: getAppLoginPassword
      description: ''
      tags:
      - App
  /app/bs/**:
    get:
      description: GET /app/bs/**
      tags:
      - App
      summary: Get app bs **
      x-summary-source: derived
      operationId: getAppBs**
      x-operation-id-source: derived
  /app/login/eula:
    get:
      tags:
      - App
      summary: Redirects to external authentication provider (Keycloak)
      description: ''
      operationId: getAppLoginEula
  /app/as/**:
    get:
      tags:
      - App
      description: GET /app/as/**
      summary: Get app as **
      x-summary-source: derived
      operationId: getAppAs**
      x-operation-id-source: derived
  /app/al/**:
    get:
      tags:
      - App
      description: GET /app/al/**
      summary: Get app al **
      x-summary-source: derived
      operationId: getAppAl**
      x-operation-id-source: derived
  /app/login/verify:
    get:
      tags:
      - App
      description: ''
      operationId: getAppLoginVerify
      summary: Redirects to external authentication provider (Keycloak)
  /app/devtools/*:
    get:
      tags:
      - App
      description: GET /app/devtools/*
      summary: Get app devtools *
      x-summary-source: derived
      operationId: getAppDevtools*
      x-operation-id-source: derived
  /app/login/reset:
    get:
      tags:
      - App
      operationId: getAppLoginReset
      summary: Redirects to external authentication provider (Keycloak)
      description: ''
  /app/qc/**:
    get:
      description: GET /app/qc/**
      tags:
      - App
      summary: Get app qc **
      x-summary-source: derived
      operationId: getAppQc**
      x-operation-id-source: derived
  /app/login/signUp:
    get:
      tags:
      - App
      operationId: getAppLoginSignUp
      description: ''
      summary: Redirects to external authentication provider (Keycloak)
  /app/login/finish:
    get:
      tags:
      - App
      description: ''
      summary: Redirects to external authentication provider (Keycloak)
      operationId: getAppLoginFinish
  /app/login/signIn:
    get:
      description: ''
      summary: Redirects to external authentication provider (Keycloak)
      operationId: getAppLoginSignIn
      tags:
      - App
  /app/**:
    get:
      description: GET /app/**
      tags:
      - App
      summary: Get app **
      x-summary-source: derived
      operationId: getApp**
      x-operation-id-source: derived
  /app/login:
    get:
      operationId: getAppLogin
      tags:
      - App
      summary: Redirects to external authentication provider (Keycloak)
      description: ''
  /app/login/**:
    get:
      tags:
      - App
      description: GET /app/login/**
      summary: Get app login **
      x-summary-source: derived
      operationId: getAppLogin**
      x-operation-id-source: derived
  /app/az/**:
    get:
      tags:
      - App
      description: GET /app/az/**
      summary: Get app az **
      x-summary-source: derived
      operationId: getAppAz**
      x-operation-id-source: derived
components:
  securitySchemes:
    XSRF_header:
      in: header
      description: Authentication using an XSRF protected JWT
      name: X-PL-AUTH
      type: apiKey
    Basic_Auth_-_login:
      description: Basic authentication used only at login.
      scheme: basic
      type: http
    PL_API_Key:
      in: header
      description: PL API Key in header
      name: PL-API-KEY
      type: apiKey
    DEPRECATED_-_PL_API_Key:
      in: header
      description: DEPRECATED - PL API Key in Bearer header
      name: 'Authorization: PL-API-KEY'
      type: apiKey
