  evidence: QuantumObjectType enum member OrganizationAuthGroupPermission
- from: Binding
  to: Quantum node
  kind: belongs_to
  via: ID
  evidence: UploadFileData.ID description names the quantum binding node UUID
- from: JWKS
  to: JWK
  kind: has_many
  via: keys
  evidence: $ref
quantum_graph:
  reachable_via: https://passivelogic.com/api/graphql
  introspection: authenticated-only
  node_types: 89
  node_type_registry: vocabulary/passivelogic-quantum-object-types.yml
  documented_traversal: >-
    The Quantum documentation demonstrates traversal as From → To object pairs with optional chaining —
    Building → Floor → Zone → Surface, and Zone → Property with a Where filter — via the Insights query builder.
    Those edges are documented in prose and are recorded here as the published traversal example, not as a
    field-level schema assertion.
  documented_paths:
  - [Building, Floor]
  - [Building, Zone]
  - [Building, Floor, Zone, Surface]
  - [Zone, Property]
  - [Site, Building]
gaps:
  - The GraphQL type system is not published anonymously; field-level attributes and edges cannot be captured.
  - The REST schemas describe no domain object — every building/equipment entity lives only in GraphQL.
