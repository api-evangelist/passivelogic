  kind: has_many
  via: objectIdentifierMap
  evidence: array $ref
- from: ObjectPair
  to: QuantumObjectType
  kind: has_one
  via: type
  evidence: $ref
- from: Identifier
  to: QuantumObjectType
  kind: has_one
  via: type
  evidence: $ref
- from: User
  to: AuthGroup
  kind: has_many
  via: authGroupID
  evidence: postApiAuthgroupRemoveByAuthGroupIDByUserID path parameters {authGroupID}/{userID}
- from: Organization
  to: AuthGroup
  kind: has_many
