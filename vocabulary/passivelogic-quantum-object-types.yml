name: Quantum Object Types
description: >-
  The 89-member QuantumObjectType enumeration published in the PassiveLogic OpenAPI is the node-type registry of the
  Quantum digital twin ontology — every kind of thing that can exist as a node in the Quantum graph, from physical
  building fabric (Building, Floor, Zone, Surface, Vertex, Adjacency) through systems engineering (Equipment,
  EquipmentComponent, System, Subsystem, ConnectionNode, ConnectionNet, Behavior, Quanta, Property, Equation) to
  platform concerns (User, Organization, AuthGroup, ApiKey, Event, History, Prediction). It is the closest thing
  PassiveLogic publishes to a machine-readable ontology term list, and it is the vocabulary the Quantum GraphQL API
  is typed against. Terms are transcribed verbatim; the groupings below are API Evangelist's reading of the terms,
  not a PassiveLogic-published taxonomy.
term_count: 89
